<!DOCTYPE html>
<html>
<head>
    <title>SRS</title>
    <meta charset="utf-8">
    <style>
        body{
            padding-top: 0px;
            padding-bottom: 0px;
            padding-left: 0px;
            padding-right: 0px;
        }
    </style>
    <style>
        .hidden-div {
            display: none;
        }
    </style>

    <style>
        #rtc_media_player {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 2;
                background-color: rgba(0, 0, 0, 0.5); /* 半透明背景 */
                display: flex;
                justify-content: center;
                align-items: center;
            }
        .overlay button {
                padding: 10px 20px;
                font-size: 18px;
                cursor: pointer;
            }
    </style>


    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css"/>
    <script type="text/javascript" src="js/jquery-1.12.2.min.js"></script>
    <script type="text/javascript" src="js/adapter-7.4.0.min.js"></script>
    <script type="text/javascript" src="js/srs.sdk.js"></script>
    <script type="text/javascript" src="js/winlin.utility.js"></script>
    <script type="text/javascript" src="js/srs.page.js"></script>

    <script type="text/javascript">
        function receiveMessage(message) {
            // Handle received message from iOS
            console.log("Received message from Native: " + message);

            // Send response back to Native
            window.webkit.messageHandlers.messageHandler.postMessage("ok");

            if (message === 'start') {
                // 调用 body 中的方法
                var button = document.getElementById("btn_play");
                button.click()
                window.webkit.messageHandlers.messageHandler.postMessage("playState_prepared");
            }  
        }
    </script>

    <script>
        $(document).ready(function() {
            // 使用 prop 方法设置 playsinline 属性
            $('#rtc_media_player').prop('playsinline', true);
            // 尝试禁用画中画，以下代码可能对不同浏览器的兼容性有限
            var video = document.getElementById('rtc_media_player');
            if (video.webkitEnterFullscreen) {
                video.webkitEnterFullscreen = function() {};
            }
            if (video.webkitSetPresentationMode) {
                video.webkitSetPresentationMode = function() {};
            }
            // 自定义的 JavaScript 逻辑，例如控制播放、暂停等
            var playButton = $('<button>').text('Play');
            playButton.click(function() {
                var video = $('#rtc_media_player')[0];
                if (video.paused) {
                    video.play();
                    playButton.text('Pause');
                } else {
                    video.pause();
                    playButton.text('Play');
                }
            });
            $('body').append(playButton);
            // 创建并添加覆盖层
            var overlay = $('<div class="overlay"></div>');
            var overlayButton = $('<button>Click Me</button>');
            overlayButton.click(function() {
                alert('Overlay button clicked');
            });
            overlay.append(overlayButton);
            $('body').append(overlay);
        });
    </script>

</head>

<body>
<div class="container">
    <div class="hidden-div">
        <button class="btn btn-primary" id="btn_play">Play</button>
    </div>
    <video id="rtc_media_player"  autoplay muted></video>
</div>

<script>
    //事件说明 https://developer.mozilla.org/zh-CN/docs/Web/HTML/Element/video
    var video = document.getElementById('rtc_media_player');
    video.addEventListener('loadedmetadata', function() {
        console.log('Metadata for the video has been loaded.');
        window.webkit.messageHandlers.messageHandler.postMessage("playState_buffering_start");
    });
    video.addEventListener('loadeddata', function() {
        console.log('The first frame of the video has been loaded.');
        window.webkit.messageHandlers.messageHandler.postMessage("playState_render_first_frame");
    });
    video.addEventListener('canplay', function() {
        console.log('The video can start playing, but might still be buffering.');
    });
    video.addEventListener('canplaythrough', function() {
        console.log('The video can play through without buffering.');
    });
</script>

<script type="text/javascript">
$(function(){
    var sdk = null; // Global handler to do cleanup when republishing.
    var startPlay = function() {
        console.warn('startPlay')
        $('#rtc_media_player').show();
        if (sdk) {
            sdk.close();
        }
        sdk = new SrsRtcWhipWhepAsync();

        $('#rtc_media_player').prop('srcObject', sdk.stream);
        $('#rtc_media_player').prop('allowfullscreen', false);

        var url = "http://192.168.2.128:1985/rtc/v1/whep/?app=live&stream=livestream"
        sdk.play(url, {
            videoOnly: false,
            audioOnly: false,
        }).then(function(session){
            $('#sessionid').html(session.sessionid);
            $('#simulator-drop').attr('href', session.simulator + '?drop=1&username=' + session.sessionid);
        }).catch(function (reason) {
            sdk.close();
            $('#rtc_media_player').hide();
            console.error(reason);
        });
    };
    $('#rtc_media_player').hide();
    var query = parse_query_string();
    $("#btn_play").click(startPlay);
    if (query.autostart === 'true') {
        $('#rtc_media_player').prop('muted', true);
        window.addEventListener("load", function(){ startPlay(); });
    }
});
</script>
</body>
</html>
