<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="height=device-height, viewport-fit=cover">
    <script src="./node_modules/iphone-inline-video/dist/iphone-inline-video.js"></script>
    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css" />
    <script type="text/javascript" src="js/jquery-1.12.2.min.js"></script>
    <script type="text/javascript" src="js/adapter-7.4.0.min.js"></script>
    <script type="text/javascript" src="js/srs.sdk.js"></script>
    <script type="text/javascript" src="js/winlin.utility.js"></script>
    <script type="text/javascript" src="js/srs.page.js"></script>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #video_content {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: coral;
            z-index: 1;
        }

        /* 给video 标签加样式 */
        #video_content video {
            width: 99%;
            height: 99%;
            background-color: #00ff0070;
        }

        .mask-controls {
            position: fixed;
            top: 0;
            left: 100;
            width: 100%;
            height: 100vh;
            background-color: #00000000;
            z-index: 2;
            justify-content: center;
            align-items: center;
            display: flex;
        }

        #bt_play {
            width: 100px;
            height: 50px;
        }

        video::-webkit-media-controls {
            display: none;
        }
    </style>


    <script type="text/javascript">
        function receiveMessage(message) {
            // Handle received message from iOS
            console.log("Received message from Native: " + message);

            // Send response back to Native
            window.webkit.messageHandlers.messageHandler.postMessage("ok");

            if (message === 'start') {
                // 调用 body 中的方法
                var button = document.getElementById("btn_play");
                button.click()
                window.webkit.messageHandlers.messageHandler.postMessage("playState_prepared");
            }
        }
    </script>

</head>
<!-- poster="img/cover.jpg" -->

<body>
    <div id="video_content">
        <video id="rtc_media_player" poster="img/cover.jpg" webkit-playsinline playsinline>
            Your browser does not support the video tag.
        </video>
    </div>

    <div>
        <button id="btn_play" >Play Video222</button>
    </div>


    <script type="text/javascript">

        $(function () {
            var sdk = null; // Global handler to do cleanup when republishing.

            if (sdk) {
                    sdk.close();
                }
               // sdk = new SrsRtcWhipWhepAsync();
                sdk = new SrsRtcPlayerAsync();
                var videoElement = document.getElementById('rtc_media_player');  
                //enableInlineVideo(videoElement)      

                var url = "http://8.148.4.21:1985/rtc/v1/whep/?app=live&stream=livestream"
               // var url = "http://10.45.16.94:1985/rtc/v1/whep/?app=live&stream=livestream"
                //var url = "webrtc://192.168.2.128/live/show"
                sdk.play(url, {
                    videoOnly: false,
                    audioOnly: false,
                }).then(function (session) {
                    videoElement.srcObject = sdk.stream
                    window.webkit.messageHandlers.messageHandler.postMessage("real play 1");
                }).catch(function (reason) {
                    sdk.close();
                    console.error(reason);
                    window.webkit.messageHandlers.messageHandler.postMessage("real play " + reason);
                });



            var startPlay = function () {
                console.warn('startPlay')
                $('#rtc_media_player').show();
                videoElement.play()
                window.webkit.messageHandlers.messageHandler.postMessage("startPlay  called");
            };
            //$('#rtc_media_player').hide();
            var query = parse_query_string();
            $("#btn_play").click(startPlay);
        });
    </script>



    <script>
        //事件说明 https://developer.mozilla.org/zh-CN/docs/Web/HTML/Element/video
        var video = document.getElementById('rtc_media_player');
        video.addEventListener('loadedmetadata', function () {
            console.log('Metadata for the video has been loaded.');
            window.webkit.messageHandlers.messageHandler.postMessage("playState_buffering_start");
        });
        video.addEventListener('loadeddata', function () {
            console.log('The first frame of the video has been loaded.');
            window.webkit.messageHandlers.messageHandler.postMessage("playState_render_first_frame");
        });
        video.addEventListener('canplay', function () {
            console.log('The video can start playing, but might still be buffering.');
        });
        video.addEventListener('canplaythrough', function () {
            console.log('The video can play through without buffering.');
        });
        video.addEventListener('waiting', function () {
            window.webkit.messageHandlers.messageHandler.postMessage("playState_waiting");
        });
        video.addEventListener('progress', function () {
            window.webkit.messageHandlers.messageHandler.postMessage("playState_progress");
        });
        video.addEventListener('play', function () {
            window.webkit.messageHandlers.messageHandler.postMessage("playState_play");
        });
        video.addEventListener('pause', function () {
            window.webkit.messageHandlers.messageHandler.postMessage("playState_pause");
        });
        video.addEventListener('error', function () {
            window.webkit.messageHandlers.messageHandler.postMessage("playState_error");
        });

        video.addEventListener('webkitfullscreenchange', function (event) {
        if (document.webkitIsFullScreen) {
            // 视频进入全屏模式
            window.webkit.messageHandlers.fullscreen.postMessage('playState_enter');
        } else {
            // 视频退出全屏模式
            window.webkit.messageHandlers.fullscreen.postMessage('playState_exit');
        }
    });
    </script>

</body>

</html>
