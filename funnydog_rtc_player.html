<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #rtc_media_player {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            background: #230d6c;
        }
    </style>
    <script src="js/adapter-7.4.0.min.js"></script>
    <script src="js/srs.sdk.js"></script>
</head>
<body>
    <video 
        id="rtc_media_player" 
        playsinline
        webkit-playsinline 
        x5-playsinline 
        ></video>

<script>
(function(){
    let sdk = null;
    const video = document.getElementById('rtc_media_player');


    // 初始化播放器（不自动播放）
    function initPlayer() {
        video.muted = true;
        sdk = new SrsRtcPlayerAsync();
        video.srcObject = sdk.stream;

        const query = new URLSearchParams(location.search);
        const streamUrl = query.get('stream') || 'webrtc://192.168.2.128/live/livestream';
        
        sdk.play(streamUrl)
            .then(() => {
                //App.postMessage('playStarted');
            })
            .catch(err => {
                console.error('播放失败:', err);
                App.postMessage('playFailed');
                video.remove();
            });
    }

    
    // 暴露给Flutter的全局播放方法
    window.startPlay = function() {
        if (!sdk) {
            initPlayer();ß
        }
        video.play();
        video.muted = false;
        video.volume = 0.5;
    };

    window.pause = function() {
        if (!sdk) {
            return
        }
        video.pause();
    };

    window.resume = function() {
        if (!sdk) {
            return
        }
        video.muted = false;
        video.play();
    };

    // 暴露音量控制方法
    window.setMuted = function(muted) {
        video.muted = !!muted;
        App.postMessage(`muteState:${video.muted}`);
    };

    window.setVolume = function(volume) {
        const validVolume = Math.min(1, Math.max(0, volume));
        video.volume = validVolume;
        App.postMessage(`volumeChange:${validVolume}`);
    };

    // 增加销毁方法
    window.cleanupPlayer = function() {
        if (sdk) {
            sdk.close(); // 调用SDK的关闭方法
            sdk = null;
        }
        if (video.srcObject) {
            video.srcObject.getTracks().forEach(track => track.stop());
            video.srcObject = null;
        }
        video.remove();
    };

    // 监听页面卸载事件
    window.addEventListener('beforeunload', () => {
        cleanupPlayer();
        App.postMessage('pageUnload');
    });

    // 页面加载初始化
    if(document.readyState === 'complete') {
        initPlayer();
    } else {
        window.addEventListener('load', initPlayer);
    }

    // 错误处理
    video.addEventListener('error', (e) => {
        App.postMessage('playerError:' + e.target.error.code);
    });


    //视频开始播放时
    video.addEventListener('play', (e) => {
        App.postMessage('play');
    });

    // 播放状态监测
    let isFirstFrame = false;
    video.addEventListener('playing', () => {
        if (!isFirstFrame) {
            isFirstFrame = true;
            App.postMessage('firstFrame');
        }
        App.postMessage('playing');
    });

    //视频暂停时
    video.addEventListener('pause', (e) => {
        App.postMessage('pause');
    });

    //视频播放结束时
    video.addEventListener('ended', (e) => {
        App.postMessage('ended');
    });

    //开始跳转播放位置时
    video.addEventListener('seeking', (e) => {
        App.postMessage('seeking');
    });

    //开始跳转播放位置时
    video.addEventListener('seeked', (e) => {
        App.postMessage('seeked');
    });

    //开始加载视频资源时
    video.addEventListener('loadstart', (e) => {
        App.postMessage('loadstart');
    });

    //因缓冲不足暂停播放时
    video.addEventListener('waiting', (e) => {
        App.postMessage('waiting');
    });

    //尝试获取数据但无数据到达时
    video.addEventListener('stalled', (e) => {
        App.postMessage('stalled');
    });

    // 尺寸适应
    window.addEventListener('resize', () => {
        const scale = Math.min(
            window.innerWidth / video.videoWidth,
            window.innerHeight / video.videoHeight
        );
        video.style.transform = `scale(${scale})`;
    });
})();
</script>
</body>
</html>
